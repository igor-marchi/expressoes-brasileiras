<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Expressão do dia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#14231B;background:#F4F6F1}
a{color:#14231B;text-decoration:none}a:hover{color:#0F6B43}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 820px; background: #F4F6F1; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 64px; border-bottom: 1px solid #D9E0D6">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; background: #0F6B43; display: flex; align-items: center; justify-content: center; border-radius: 50%">
<div style="width: 14px; height: 14px; background: #F5C518; transform: rotate(45deg)"></div>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Expressões do Brasil</span>
</div>
<nav style="display: flex; gap: 32px; font-size: 16px; font-weight: 500">
<a href="Main.dc.html" style="border-bottom: 2px solid #F5C518; padding-bottom: 4px">Início</a>
<a href="Todas.dc.html">Todas</a>
<a href="Favoritas.dc.html" style="color: #4F5F56">Favoritas</a>
</nav>
</header>

<main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 48px; padding: 56px 64px; max-width: 1152px; margin: 0 auto; width: 100%; box-sizing: border-box">

<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">

<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="background: #F5C518; color: #14231B; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px">{{counter}}</span>
<span style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #4F5F56; font-weight: 600">Expressão popular</span>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 68px; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance">{{text}}</h1>
<p style="margin: 0; font-size: 22px; line-height: 1.4; color: #14231B; max-width: 460px">{{meaning}}</p>
</div>

<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 0; background: #FFFFFF; border: 1px solid #D9E0D6; border-radius: 8px">
<section style="padding: 28px 32px; border-bottom: 1px solid #D9E0D6; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0F6B43; font-weight: 600">Origem</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55">{{origin}}</p>
</section>
<section style="padding: 28px 32px; border-bottom: 1px solid #D9E0D6; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0F6B43; font-weight: 600">Por que se diz assim</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55">{{why}}</p>
</section>
<section style="padding: 28px 32px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0F6B43; font-weight: 600">Exemplo</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; font-style: italic">“{{example}}”</p>
</section>
</div>

</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid #D9E0D6; padding-top: 32px">
<div role="progressbar" aria-label="Progresso" style="width: 256px; height: 8px; border-radius: 999px; background: #C3CDC0; overflow: hidden">
<div style="{{progressStyle}}"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button onClick="{{toggleFav}}" aria-pressed="{{pressed}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; background: #FFFFFF; color: #14231B; border: 1px solid #C3CDC0; border-radius: 999px; font-size: 18px; font-weight: 600; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{starFill}}" stroke="#0F6B43" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
{{favLabel}}
</button>
<button onClick="{{prev}}" aria-keyshortcuts="ArrowLeft" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 28px; background: #FFFFFF; color: #14231B; border: 1px solid #C3CDC0; border-radius: 999px; font-size: 18px; font-weight: 600; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14231B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
Anterior
</button>
<button onClick="{{next}}" aria-keyshortcuts="ArrowRight" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 28px; background: #0F6B43; color: #FFFFFF; border: 0; border-radius: 999px; font-size: 18px; font-weight: 600; cursor: pointer">
Próximo
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
</div>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, favs: {} };
  }
  renderVals() {
    const list = [
      { text: "Dar com os burros n'água", meaning: "Fracassar, ver um plano dar errado.", origin: "Vem do tempo das tropas de mulas e burros que levavam mercadorias pelo interior. Ao atravessar rios, os animais às vezes caíam na água e a carga se perdia.", why: "Quando os burros iam parar na água, a viagem e o lucro iam junto. O prejuízo virou sinônimo de qualquer empreitada que desanda.", example: "Montei a loja sem pesquisar o mercado e dei com os burros n'água." },
      { text: "Boi de piranha", meaning: "Pessoa sacrificada para que os outros passem em segurança.", origin: "Vem da lida com o gado em regiões de rios, como o Pantanal e a Amazônia. Os vaqueiros mandavam um animal de pouco valor à frente para distrair as piranhas.", why: "Enquanto as piranhas atacavam o boi isca, o resto da manada atravessava o rio ilesa. Hoje descreve quem paga pelos outros.", example: "O estagiário virou boi de piranha e levou a culpa pelo erro da equipe." },
      { text: "Tirar o cavalinho da chuva", meaning: "Desistir de uma ideia ou de uma expectativa.", origin: "Segundo a versão mais difundida, quem fazia visita rápida deixava o cavalo na chuva. Quem era convidado a ficar o levava para um abrigo.", why: "Tirar o cavalo da chuva indicava que a visita ia durar. A expressão ganhou o sentido de avisar que o outro pode desistir e se acomodar.", example: "Pode tirar o cavalinho da chuva, esse aumento não vai sair." }
    ];
    const n = list.length;
    const e = list[this.state.i];
    const progressStyle = "height: 100%; border-radius: 999px; background: #0F6B43; width: " + ((this.state.i + 1) / n * 100) + "%";
    return {
      text: e.text, meaning: e.meaning, origin: e.origin, why: e.why, example: e.example,
      counter: (this.state.i + 1) + " de " + n,
      progressStyle,
      starFill: this.state.favs[this.state.i] ? "#F5C518" : "none",
      pressed: this.state.favs[this.state.i] ? "true" : "false",
      favLabel: this.state.favs[this.state.i] ? "Favoritada" : "Favoritar",
      toggleFav: () => this.setState({ favs: { ...this.state.favs, [this.state.i]: !this.state.favs[this.state.i] } }),
      prev: () => this.setState({ i: (this.state.i + n - 1) % n }),
      next: () => this.setState({ i: (this.state.i + 1) % n })
    };
  }
}
</script>
</body>
</html>
