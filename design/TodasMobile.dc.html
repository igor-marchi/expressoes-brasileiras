<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Todas as expressões no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#14231B;background:#F4F6F1}
a{color:#14231B;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; background: #F4F6F1; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px; border-bottom: 1px solid #D9E0D6">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 30px; height: 30px; background: #0F6B43; display: flex; align-items: center; justify-content: center; border-radius: 50%">
<div style="width: 11px; height: 11px; background: #F5C518; transform: rotate(45deg)"></div>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">Expressões do Brasil</span>
</div>
<button aria-label="Abrir menu" style="width: 44px; height: 44px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14231B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>

<main style="display: flex; flex-direction: column; gap: 20px; padding: 24px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em">Todas as expressões</h1>
<p style="margin: 0; font-size: 18px; color: #4F5F56">798 expressões. Escolha uma para ver origem e significado.</p>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #C3CDC0; border-radius: 999px; padding: 0 20px; min-height: 48px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5F56" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="text" aria-label="Buscar expressão" placeholder="Buscar expressão" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 16px; color: #14231B">
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
<div style="position: relative; display: flex; flex-direction: column">
<a href="Main.dc.html" style="background: #FFFFFF; border: 1px solid #D9E0D6; border-radius: 8px; padding: 20px 68px 20px 20px; flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #0F6B43; font-weight: 600; letter-spacing: 0.08em">{{c.position}}</span>
<span style="{{c.tagStyle}}">{{c.tagLabel}}</span>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1; color: #14231B">{{c.text}}</span>
<span style="font-size: 15px; line-height: 1.45; color: #4F5F56">{{c.meaning}}</span>
</a>
<button aria-label="{{c.starLabel}}" aria-pressed="{{c.starPressed}}" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 999px"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{c.starFill}}" stroke="{{c.starStroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></button>
</div>
</sc-for>
</div>

<nav aria-label="Paginação" style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #D9E0D6; padding-top: 20px">
<p style="margin: 0; font-size: 15px; color: #4F5F56; text-align: center">Mostrando 6 a 10 de 798</p>
<p style="margin: 0 0 10px; font-size: 16px; font-weight: 600; color: #14231B; text-align: center">Página 2 de 160</p>
<div style="display: flex; gap: 12px">
<button aria-label="Página anterior" style="flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: #FFFFFF; color: #14231B; border: 1px solid #C3CDC0; border-radius: 999px; font-size: 16px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14231B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
Anterior
</button>
<button aria-label="Próxima página" style="flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: #0F6B43; color: #FFFFFF; border: 0; border-radius: 999px; font-size: 16px; font-weight: 600">
Próxima
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const sample = [{"text": "Dar com os burros n'água", "meaning": "Fracassar, ver um plano dar errado.", "kind": "expression", "pos": 1}, {"text": "Vaca de presépio", "meaning": "Pessoa que concorda com tudo e só acompanha, sem opinião.", "kind": "noun-phrase", "pos": 2}, {"text": "Boi de piranha", "meaning": "Pessoa sacrificada para que os outros passem em segurança ou escapem de um problema.", "kind": "expression", "pos": 3}, {"text": "Cabelo ruim", "meaning": "Forma de dizer que o cabelo crespo é difícil de tratar.", "kind": "noun-phrase", "pos": 4}, {"text": "Tirar o cavalinho da chuva", "meaning": "Desistir de uma ideia ou de uma expectativa.", "kind": "expression", "pos": 5}, {"text": "Pé-rapado", "meaning": "Pessoa de condição humilde, com poucos recursos.", "kind": "noun-phrase", "pos": 6}, {"text": "Pé na jaca", "meaning": "Exagerar, sobretudo em comida, bebida ou festa.", "kind": "expression", "pos": 7}, {"text": "Arraia-miúda", "meaning": "O povo comum, as pessoas simples e sem poder.", "kind": "noun-phrase", "pos": 8}, {"text": "Rodar a baiana", "meaning": "Fazer escândalo, perder a compostura em público.", "kind": "expression", "pos": 9}, {"text": "Pau de arara", "meaning": "Caminhão de migrantes nordestinos e também método de tortura.", "kind": "noun-phrase", "pos": 10}, {"text": "Ficar a ver navios", "meaning": "Ficar esperando algo que não vai chegar, ou perder uma oportunidade.", "kind": "expression", "pos": 11}, {"text": "Beco sem saída", "meaning": "Situação sem solução aparente, da qual não dá para escapar.", "kind": "noun-phrase", "pos": 12}];
    const LABELS = { expression: "Expressão popular", "noun-phrase": "Locução substantiva" };
    const STYLES = { expression: "display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; color: #4F5F56; background: #F4F6F1; border: 1px solid #D9E0D6", "noun-phrase": "display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; color: #14231B; background: #FDF1C5; border: 1px solid #F5C518" };
    const favs = { 0: true, 3: true, 5: true };
    const cards = sample.slice(5, 10).map((e, i) => ({
      position: e.pos + " DE 763",
      text: e.text,
      tagLabel: LABELS[e.kind],
      tagStyle: STYLES[e.kind],
      meaning: e.meaning,
      starLabel: favs[i] ? "Remover dos favoritos" : "Adicionar aos favoritos",
      starPressed: favs[i] ? "true" : "false",
      starFill: favs[i] ? "#F5C518" : "none",
      starStroke: favs[i] ? "#0F6B43" : "#4F5F56"
    }));
    return { cards };
  }
}
</script>
</body>
</html>
