<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Todas as expressões</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#14231B;background:#F4F6F1}
a{color:#14231B;text-decoration:none}a:hover{color:#0F6B43}
</style>
</helmet>
<div style="min-height: 1300px; background: #F4F6F1; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 64px; border-bottom: 1px solid #D9E0D6">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; background: #0F6B43; display: flex; align-items: center; justify-content: center; border-radius: 50%">
<div style="width: 14px; height: 14px; background: #F5C518; transform: rotate(45deg)"></div>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Expressões do Brasil</span>
</div>
<nav style="display: flex; gap: 32px; font-size: 16px; font-weight: 500">
<a href="Main.dc.html">Início</a>
<a href="Todas.dc.html" style="border-bottom: 2px solid #F5C518; padding-bottom: 4px">Todas</a>
<a href="Favoritas.dc.html" style="color: #4F5F56">Favoritas</a>
</nav>
</header>

<main style="max-width: 1152px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 48px; letter-spacing: -0.02em">Todas as expressões</h1>
<p style="margin: 0; font-size: 18px; color: #4F5F56">522 expressões. Escolha uma para ver origem e significado.</p>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #C3CDC0; border-radius: 999px; padding: 0 20px; min-height: 48px; width: 320px; max-width: 100%; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5F56" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar expressão</label>
<input id="busca" type="text" placeholder="Buscar expressão" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 16px; color: #14231B">
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
<div style="position: relative; display: flex; flex-direction: column">
<a href="Main.dc.html" style="background: #FFFFFF; border: 1px solid #D9E0D6; border-radius: 8px; padding: 24px 68px 24px 28px; flex: 1; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #0F6B43; font-weight: 600; letter-spacing: 0.08em">{{c.position}}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; color: #14231B">{{c.text}}</span>
<span style="font-size: 16px; line-height: 1.45; color: #4F5F56">{{c.meaning}}</span>
</a>
<button aria-label="{{c.starLabel}}" aria-pressed="{{c.starPressed}}" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 999px; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{c.starFill}}" stroke="{{c.starStroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
</div>
</sc-for>
</div>

<nav aria-label="Paginação" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #D9E0D6; padding-top: 24px">
<p style="margin: 0; font-size: 15px; color: #4F5F56">Mostrando 1 a 10 de 522</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button disabled aria-label="Página anterior" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; background: #FFFFFF; color: #14231B; border: 1px solid #C3CDC0; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 600; opacity: 0.4; cursor: not-allowed">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14231B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
Anterior
</button>
<sc-for list="{{pages}}" as="pg" hint-placeholder-count="7">
<span style="{{pg.style}}" aria-current="{{pg.current}}">{{pg.label}}</span>
</sc-for>
<button aria-label="Próxima página" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; background: #0F6B43; color: #FFFFFF; border: 0; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
Próxima
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
</div>
</nav>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const sample = [{"text":"Dar com os burros n'água","meaning":"Fracassar, ver um plano dar errado."},{"text":"Boi de piranha","meaning":"Pessoa sacrificada para que os outros passem em segurança ou escapem de um problema."},{"text":"Tirar o cavalinho da chuva","meaning":"Desistir de uma ideia ou de uma expectativa."},{"text":"Pé na jaca","meaning":"Exagerar, sobretudo em comida, bebida ou festa."},{"text":"Rodar a baiana","meaning":"Fazer escândalo, perder a compostura em público."},{"text":"Ficar a ver navios","meaning":"Ficar esperando algo que não vai chegar, ou perder uma oportunidade."},{"text":"Maria vai com as outras","meaning":"Pessoa sem opinião própria, que faz o que a maioria faz."},{"text":"Onde Judas perdeu as botas","meaning":"Lugar muito distante, de difícil acesso."},{"text":"Quebrar o galho","meaning":"Resolver um problema de forma improvisada ou ajudar alguém num aperto."},{"text":"Dar o braço a torcer","meaning":"Admitir que estava errado e ceder diante de outra opinião."},{"text":"Chutar o balde","meaning":"Desistir de tudo, perder a paciência e jogar o esforço fora."},{"text":"Engolir sapo","meaning":"Aguentar uma situação desagradável sem poder reclamar."},{"text":"Matar dois coelhos com uma cajadada só","meaning":"Resolver dois problemas de uma vez, com uma única ação."},{"text":"Água mole em pedra dura, tanto bate até que fura","meaning":"Com persistência, até o que parece impossível acaba cedendo."},{"text":"Pagar o pato","meaning":"Ser punido ou arcar com a culpa de algo que não fez."},{"text":"Cada macaco no seu galho","meaning":"Cada pessoa deve cuidar do que é da sua área e não se meter no resto."},{"text":"Estar com a faca e o queijo na mão","meaning":"Ter tudo o que precisa para conseguir o que quer."},{"text":"Pisar na bola","meaning":"Errar ou falhar com alguém, geralmente por descuido."},{"text":"Fazer vista grossa","meaning":"Fingir que não viu algo errado para evitar problema."},{"text":"Ficar de queixo caído","meaning":"Ficar muito surpreso ou impressionado."}];
    const favs = { 0: true, 3: true, 5: true };
    const cards = sample.slice(0, 10).map((e, i) => ({
      position: (i + 1) + " DE 522",
      text: e.text,
      meaning: e.meaning,
      starLabel: favs[i] ? "Remover dos favoritos" : "Adicionar aos favoritos",
      starPressed: favs[i] ? "true" : "false",
      starFill: favs[i] ? "#F5C518" : "none",
      starStroke: favs[i] ? "#0F6B43" : "#4F5F56"
    }));
    const base = "display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; box-sizing: border-box; border-radius: 999px; font-size: 16px; font-weight: 600; ";
    const idle = base + "background: #FFFFFF; color: #14231B; border: 1px solid #C3CDC0";
    const current = base + "background: #0F6B43; color: #FFFFFF; border: 1px solid #0F6B43";
    const gap = base + "color: #4F5F56; border: 1px solid transparent";
    const pages = [
      { label: "1", style: current, current: "page" },
      { label: "2", style: idle, current: "false" },
      { label: "3", style: idle, current: "false" },
      { label: "4", style: idle, current: "false" },
      { label: "…", style: gap, current: "false" },
      { label: "53", style: idle, current: "false" }
    ];
    return { cards, pages };
  }
}
</script>
</body>
</html>
