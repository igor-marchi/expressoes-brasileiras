<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Favoritas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#14231B;background:#F4F6F1}
a{color:#14231B;text-decoration:none}a:hover{color:#0F6B43}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F6F1; display: flex; flex-direction: column; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 64px; border-bottom: 1px solid #D9E0D6">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; background: #0F6B43; display: flex; align-items: center; justify-content: center; border-radius: 50%">
<div style="width: 14px; height: 14px; background: #F5C518; transform: rotate(45deg)"></div>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Expressões do Brasil</span>
</div>
<nav style="display: flex; gap: 32px; font-size: 16px; font-weight: 500">
<a href="Main.dc.html">Início</a>
<a href="Todas.dc.html">Todas</a>
<a href="Favoritas.dc.html" style="border-bottom: 2px solid #F5C518; padding-bottom: 4px">Favoritas</a>
</nav>
</header>

<main style="max-width: 1152px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 48px; letter-spacing: -0.02em">Favoritas</h1>
<p style="margin: 0; font-size: 18px; color: #4F5F56">{{countLabel}}</p>
</div>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="3">
<div style="position: relative; display: flex; flex-direction: column">
<a href="Main.dc.html" style="flex: 1; background: #FFFFFF; border: 1px solid #D9E0D6; border-radius: 8px; padding: 24px 68px 24px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #0F6B43; font-weight: 600; letter-spacing: 0.08em">{{item.label}}</span>
<span style="{{item.tagStyle}}">{{item.tagLabel}}</span>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; color: #14231B">{{item.text}}</span>
<span style="font-size: 16px; line-height: 1.45; color: #4F5F56">{{item.meaning}}</span>
</a>
<button onClick="{{item.remove}}" aria-label="Remover dos favoritos" aria-pressed="true" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 999px; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#F5C518" stroke="#0F6B43" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
</button>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding: 72px 24px; background: #FFFFFF; border: 1px solid #D9E0D6; border-radius: 8px">
<div style="width: 72px; height: 72px; border-radius: 50%; background: #F4F6F1; border: 1px solid #D9E0D6; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4F5F56" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
</div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.01em">Nenhuma favorita ainda</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #4F5F56; max-width: 420px">Toque na estrela de uma expressão para guardá-la aqui e reler depois.</p>
<a href="Todas.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: #0F6B43; color: #FFFFFF; border-radius: 999px; font-size: 18px; font-weight: 600">Ver todas as expressões</a>
</div>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: {} };
  }
  renderVals() {
    const all = [
      { id: "a", label: "1 DE 798", kind: "expression", text: "Dar com os burros n'água", meaning: "Fracassar, ver um plano dar errado." },
      { id: "b", label: "4 DE 798", kind: "noun-phrase", text: "Cabelo ruim", meaning: "Forma de dizer que o cabelo crespo é difícil de tratar." },
      { id: "c", label: "8 DE 798", kind: "noun-phrase", text: "Arraia-miúda", meaning: "O povo comum, as pessoas simples e sem poder." }
    ];
    const LABELS = { expression: "Expressão popular", "noun-phrase": "Locução substantiva" };
    const STYLES = { expression: "display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; color: #4F5F56; background: #F4F6F1; border: 1px solid #D9E0D6", "noun-phrase": "display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; color: #14231B; background: #FDF1C5; border: 1px solid #F5C518" };
    const kept = all.filter((x) => !this.state.removed[x.id]);
    const items = kept.map((x) => ({ ...x, tagLabel: LABELS[x.kind], tagStyle: STYLES[x.kind], remove: () => this.setState({ removed: { ...this.state.removed, [x.id]: true } }) }));
    const n = kept.length;
    return {
      items,
      hasItems: n > 0,
      isEmpty: n === 0,
      countLabel: n === 0 ? "Você ainda não favoritou nada." : n === 1 ? "1 expressão salva." : n + " expressões salvas."
    };
  }
}
</script>
</body>
</html>
